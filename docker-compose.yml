version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: xpcs-postgres
    environment:
      POSTGRES_USER: xpcs_user
      POSTGRES_PASSWORD: xpcs_pass_2024
      POSTGRES_DB: xpcs_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant: # docker compose is a tool that reads this docker-compose.yml file and manages qdrant docker container
    image: qdrant/qdrant:latest # docker image (blueprint)
    container_name: xpcs-qdrant # docker container (running instance of that image)
    ports: 
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  qdrant_data: